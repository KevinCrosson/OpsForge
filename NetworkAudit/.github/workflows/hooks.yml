# ------------------------------------------------------------
# Workflow Name
# ------------------------------------------------------------
# This is the name that will appear in GitHub Actions UI.
name: Git Hooks Hygiene

# ------------------------------------------------------------
# Trigger Conditions
# ------------------------------------------------------------
# Defines when this workflow should run.
on:
  push:                # Run on every push to the repo
    branches: [ main ] # Limit to pushes on the main branch
  pull_request:        # Run on every pull request targeting main
    branches: [ main ]

# ------------------------------------------------------------
# Jobs Section
# ------------------------------------------------------------
jobs:
  hooks-validation:    # Job name (appears in GitHub Actions UI)
    runs-on: ubuntu-latest   # Use Ubuntu runner for fast shell checks

    steps:
      # --------------------------------------------------------
      # Step 1: Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        # Pulls down your repo code so the workflow can access .git/hooks.

      # --------------------------------------------------------
      # Step 2: Verify pre-commit hook exists
      # --------------------------------------------------------
      - name: Check pre-commit hook presence
        run: |
          if [ ! -f .git/hooks/pre-commit ]; then
            echo "❌ pre-commit hook is missing!"
            exit 1
          else
            echo "✅ pre-commit hook found."
          fi

      # --------------------------------------------------------
      # Step 3: Verify hook is executable
      # --------------------------------------------------------
      - name: Check pre-commit hook permissions
        run: |
          if [ ! -x .git/hooks/pre-commit ]; then
            echo "❌ pre-commit hook is not executable!"
            exit 1
          else
            echo "✅ pre-commit hook is executable."
          fi

      # --------------------------------------------------------
      # Step 4: Run hook in dry-run mode
      # --------------------------------------------------------
      - name: Run pre-commit hook dry-run
        shell: bash
        run: |
          # Attempt to run the hook with no staged changes
          # This ensures the script itself is syntactically valid
          if .git/hooks/pre-commit --help >/dev/null 2>&1; then
            echo "✅ pre-commit hook executed successfully (dry-run)."
          else
            echo "❌ pre-commit hook failed to execute."
            exit 1
          fi

      # --------------------------------------------------------
      # Step 5: Optional Pester tests for hook logic
      # --------------------------------------------------------
      - name: Run Pester tests for hooks
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser
          Import-Module Pester
          if (Test-Path "Scripts\Tests\Test-Hooks.Tests.ps1") {
            Invoke-Pester -Path Scripts\Tests\Test-Hooks.Tests.ps1 -Output Detailed -EnableExit
          } else {
            Write-Host "ℹ️ No hook-specific Pester tests found."
          }
