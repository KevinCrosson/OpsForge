# ------------------------------------------------------------
# Azure DevOps Pipeline: Symbol Hygiene Tests
# ------------------------------------------------------------
# PURPOSE:
#   Runs Pester tests against your PowerShell scripts to ensure
#   corrupted symbols are detected and repaired consistently.
#   Uses the reusable SymbolHygiene.Tests module.
#
# TRIGGERS:
#   - On every commit to main
#   - On pull requests targeting main
# ------------------------------------------------------------

# --- Trigger pipeline on commits to main branch ---
trigger:
  branches:
    include:
      - main

# --- Trigger pipeline on pull requests into main ---
pr:
  branches:
    include:
      - main

# --- Define the build agent pool ---
pool:
  vmImage: 'windows-latest'   # Use Windows runner (matches your local dev environment)

steps:
  # --------------------------------------------------------
  # Step 1: Checkout repository
  # --------------------------------------------------------
  - task: Checkout@1
    displayName: 'Checkout repository'
    # This pulls your repo code into the pipeline workspace

  # --------------------------------------------------------
  # Step 2: Install Pester (PowerShell testing framework)
  # --------------------------------------------------------
  - task: PowerShell@2
    displayName: 'Install Pester'
    inputs:
      targetType: 'inline'
      script: |
        # Install Pester into the current user scope
        # Force ensures overwrite if already installed
        # SkipPublisherCheck avoids prompts in CI
        Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck

  # --------------------------------------------------------
  # Step 3: Configure PSModulePath
  # --------------------------------------------------------
  - task: PowerShell@2
    displayName: 'Configure PSModulePath'
    inputs:
      targetType: 'inline'
      script: |
        # Append C:\PSModules to PSModulePath
        # This makes your shared SymbolHygiene.Tests module discoverable
        $env:PSModulePath += ";C:\PSModules"
        Write-Host "PSModulePath: $env:PSModulePath"

  # --------------------------------------------------------
  # Step 4: Import SymbolHygiene.Tests and run Pester tests
  # --------------------------------------------------------
  - task: PowerShell@2
    displayName: 'Run Pester tests'
    inputs:
      targetType: 'inline'
      script: |
        # Import your reusable hygiene module
        Import-Module SymbolHygiene.Tests -ErrorAction Stop

        # Run all Pester tests under Scripts\Tests
        # Output Detailed gives full test results in CI logs
        Invoke-Pester -Path .\Scripts\Tests -Output Detailed

